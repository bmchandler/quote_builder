[project]
name = "quote-builder"
version = "0.1.0"
description = "A simple quote builder for micro businesses and solo consultants."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nicegui>=3.18.0",
]

[project.scripts]
quote-builder = "quote_builder:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
