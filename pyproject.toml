[project]
name = "quote-builder"
version = "2026.11.20.3"
description = "A simple quote builder for micro businesses and solo consultants."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nicegui[native]>=3.18.0",
    "pygobject>=3.58.1",
]

[project.scripts]
quote-builder = "quote_builder.app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-n auto"
# The release scripts (tag_new_version.py, branch_guard.py) sit in the
# repo root, so their tests can import them.
pythonpath = ["."]
