[project]
name = "quote-builder"
version = "2026.11.20.5+dev"
description = "A simple quote builder for micro businesses and solo consultants."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles==25.1.0",
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.5",
    "aiosignal==1.4.0",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "attrs==26.1.0",
    "bidict==0.24.1",
    "bottle==0.13.4",
    "certifi==2026.7.22",
    "cffi==2.1.1 ; sys_platform == 'win32'",
    "click==8.5.0",
    "clr-loader==0.3.1 ; sys_platform == 'win32'",
    "docutils==0.23",
    "fastapi==0.143.3",
    "frozenlist==1.8.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httptools==0.9.0",
    "httpx==0.28.1",
    "idna==3.20",
    "ifaddr==0.2.0",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "markdown2==2.5.5",
    "markupsafe==3.0.4",
    "multidict==7.1.0",
    "nicegui==3.18.0",
    "opentelemetry-api==1.45.1",
    "orjson==3.13.0 ; platform_machine != 'i386' and platform_machine != 'i686' and platform_python_implementation != 'PyPy'",
    "packaging==26.3 ; sys_platform == 'openbsd6'",
    "propcache==0.5.4",
    "proxy-tools==0.1.0",
    "pycairo>=1.29.2",
    "pycparser==3.11 ; implementation_name != 'PyPy' and sys_platform == 'win32'",
    "pydantic-core==2.50.1",
    "pydantic==2.14.1",
    "pygments==2.21.0",
    "pygobject>=3.58.1",
    "pyobjc-core==12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa==12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz==12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-security==12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-uniformtypeidentifiers==12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-webkit==12.2.2 ; sys_platform == 'darwin'",
    "python-dotenv==1.2.4",
    "python-engineio==4.14.0",
    "python-multipart==0.0.32",
    "python-socketio==5.17.0",
    "pythonnet==3.2.1 ; sys_platform == 'win32'",
    "pywebview==6.2.1",
    "pyyaml==6.0.3",
    "qtpy==2.4.3 ; sys_platform == 'openbsd6'",
    "simple-websocket==1.1.0",
    "starlette==1.8.0",
    "tinycss2==1.5.1",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uvicorn==0.54.0",
    "uvloop==0.23.0 ; platform_python_implementation != 'PyPy' and sys_platform != 'cygwin' and sys_platform != 'win32'",
    "watchfiles==1.3.0",
    "webencodings==0.6.1",
    "websockets==17.2",
    "wsproto==1.3.2",
    "yarl==1.25.1",
]

[project.scripts]
quote-builder = "quote_builder.app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-n auto"
# The release scripts (tag_new_version.py, branch_guard.py) sit in the
# repo root, so their tests can import them.
pythonpath = ["."]
