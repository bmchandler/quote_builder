[project]
name = "quote-builder"
version = "2026.11.22+dev"
description = "A simple quote builder for micro businesses and solo consultants."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles==25.1.0 ; sys_platform == 'linux'",
    "aiohappyeyeballs==2.7.1 ; sys_platform == 'linux'",
    "aiohttp==3.14.5 ; sys_platform == 'linux'",
    "aiosignal==1.4.0 ; sys_platform == 'linux'",
    "annotated-doc==0.0.5 ; sys_platform == 'linux'",
    "annotated-types==0.8.0 ; sys_platform == 'linux'",
    "anyio==4.15.1 ; sys_platform == 'linux'",
    "attrs==26.1.0 ; sys_platform == 'linux'",
    "bidict==0.24.1 ; sys_platform == 'linux'",
    "bottle==0.13.4 ; sys_platform == 'linux'",
    "certifi==2026.7.22 ; sys_platform == 'linux'",
    "click==8.5.0 ; sys_platform == 'linux'",
    "docutils==0.23 ; sys_platform == 'linux'",
    "fastapi==0.143.3 ; sys_platform == 'linux'",
    "frozenlist==1.8.0 ; sys_platform == 'linux'",
    "h11==0.16.0 ; sys_platform == 'linux'",
    "httpcore==1.0.9 ; sys_platform == 'linux'",
    "httptools==0.9.0 ; sys_platform == 'linux'",
    "httpx==0.28.1 ; sys_platform == 'linux'",
    "idna==3.20 ; sys_platform == 'linux'",
    "ifaddr==0.2.0 ; sys_platform == 'linux'",
    "itsdangerous==2.2.0 ; sys_platform == 'linux'",
    "jinja2==3.1.6 ; sys_platform == 'linux'",
    "markdown2==2.5.5 ; sys_platform == 'linux'",
    "markupsafe==3.0.4 ; sys_platform == 'linux'",
    "multidict==7.1.0 ; sys_platform == 'linux'",
    "nicegui==3.18.0 ; sys_platform == 'linux'",
    "opentelemetry-api==1.45.1 ; sys_platform == 'linux'",
    "orjson==3.13.0 ; platform_machine != 'i386' and platform_machine != 'i686' and platform_python_implementation != 'PyPy' and sys_platform == 'linux'",
    "propcache==0.5.4 ; sys_platform == 'linux'",
    "proxy-tools==0.1.0 ; sys_platform == 'linux'",
    "pycairo>=1.29.2 ; sys_platform == 'linux'",
    "pydantic-core==2.50.1 ; sys_platform == 'linux'",
    "pydantic==2.14.1 ; sys_platform == 'linux'",
    "pygments==2.21.0 ; sys_platform == 'linux'",
    "pygobject>=3.58.1 ; sys_platform == 'linux'",
    "python-dotenv==1.2.4 ; sys_platform == 'linux'",
    "python-engineio==4.14.0 ; sys_platform == 'linux'",
    "python-multipart==0.0.32 ; sys_platform == 'linux'",
    "python-socketio==5.17.0 ; sys_platform == 'linux'",
    "pywebview==6.2.1 ; sys_platform == 'linux'",
    "pyyaml==6.0.3 ; sys_platform == 'linux'",
    "simple-websocket==1.1.0 ; sys_platform == 'linux'",
    "starlette==1.8.0 ; sys_platform == 'linux'",
    "tinycss2==1.5.1 ; sys_platform == 'linux'",
    "typing-extensions==4.16.0 ; sys_platform == 'linux'",
    "typing-inspection==0.4.4 ; sys_platform == 'linux'",
    "uvicorn==0.54.0 ; sys_platform == 'linux'",
    "uvloop==0.23.0 ; platform_python_implementation != 'PyPy' and sys_platform == 'linux'",
    "watchfiles==1.3.0 ; sys_platform == 'linux'",
    "webencodings==0.6.1 ; sys_platform == 'linux'",
    "websockets==17.2 ; sys_platform == 'linux'",
    "wsproto==1.3.2 ; sys_platform == 'linux'",
    "yarl==1.25.1 ; sys_platform == 'linux'",
]

[project.scripts]
quote-builder = "quote_builder.app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
# Quote Builder is Linux-only (the GTK native window; see DEVELOPMENT.md),
# so resolve and lock for Linux alone. This keeps uv.lock and the frozen
# `[project.dependencies]` (regen_release_deps.py) to the Linux runtime
# set, with no macOS/Windows/BSD packages to pin or compare. uv then
# stamps each pin with `; sys_platform == 'linux'`; that marker is kept
# as uv emits it (not stripped), so the pins stay a verbatim copy of the
# lock. See RELEASING.md, Frozen dependencies.
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-n auto"
# The release scripts (tag_new_version.py, branch_guard.py) sit in the
# repo root, so their tests can import them.
pythonpath = ["."]
